<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Musical</title>
    <style>
        :root { --gold: #bf8b16; --text: #ffffff; }
        body {
            font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--text);
            background-image: url('/static/Fondo.png'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .hidden { display: none !important; }
        .view { width: 100%; max-width: 900px; padding: 20px; box-sizing: border-box; }
        h1, h2, h3 { text-align: center; }

        /* Imágenes */
        .logo-main { display: block; margin: 0 auto 10px; height: 100px; }
        .logo-nav { height: 60px; }
        .icon-btn { height: 45px; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { transform: scale(1.1); }
        .btn-volver { height: 50px; cursor: pointer; transition: 0.2s; }
        .btn-volver:hover { transform: translateX(-5px); }

        /* Inputs Base */
        input, textarea {
            width: 100%; padding: 12px 20px; border-radius: 25px; border: 2px solid var(--text);
            background: transparent; color: var(--text); box-sizing: border-box; outline: none; font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: var(--text); font-weight: bold; }
        textarea { border-radius: 15px; resize: none; height: 100%; min-height: 100px; }

        button { cursor: pointer; padding: 12px 20px; border-radius: 25px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-solid { background: var(--gold); border: 2px solid var(--gold); color: #000; }
        .btn-outline { background: transparent; border: 2px solid var(--text); color: var(--text); }

        /* --- LAYOUT INICIO SESIÓN --- */
        .login-group { margin-bottom: 20px; }
        .login-label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; margin-left: 15px; text-align: left; }

        /* --- LAYOUT REGISTRO --- */
        .panel-oscuro { background: rgba(30, 20, 0, 0.6); border-radius: 20px; padding: 30px; }
        .profile-container { background: rgba(30, 20, 0, 0.6); border-radius: 20px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 220px; box-sizing: border-box; }
        .profile-pic { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; background: white; margin-bottom: 20px; }

        /* Flexbox para colocar los inputs idénticos al boceto */
        .flex-row { display: flex; gap: 15px; margin-bottom: 15px; width: 100%; }
        .col-1 { flex: 1; }
        .col-1-5 { flex: 1.5; }
        .col-2 { flex: 2; }
        .col-half { flex: 1; width: 50%; }

        /* Navbar y Grid (Igual que antes) */
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-bar { border-radius: 25px; border: 2px solid var(--text); background: rgba(0,0,0,0.3); padding: 10px 20px; color: white; width: 350px;}
        .nav-icons { display: flex; gap: 15px; align-items: center; }
        .catalog-container { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 20px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .song-card { background: #d9d9d9; border-radius: 15px; aspect-ratio: 1; position: relative; display: flex; align-items: center; justify-content: center; color: #000; text-align: center; padding: 10px; flex-direction: column;}
        .action-btn-wrapper { position: absolute; bottom: -12px; left: -12px; background: transparent; border: none; padding: 0; cursor: pointer; transition: 0.2s;}
        .action-btn-wrapper:hover { transform: scale(1.1); }
        .action-icon { height: 35px; }
        .admin-delete-btn { position: absolute; top: -10px; right: -10px; background: transparent; border: none; cursor: pointer; transition: 0.2s; }
        .admin-delete-btn:hover { transform: scale(1.1); }
        .admin-delete-icon { height: 30px; }
    </style>
</head>
<body>

<div id="view-login" class="view">
    <img src="/static/leon-removebg-preview.png" alt="Logo" class="logo-main">
    <h2 style="font-size: 32px; margin-bottom: 30px;">¡Bienvenido!</h2>
    <form id="form-login" onsubmit="login(event)" style="max-width: 450px; margin: 0 auto;">

        <div class="login-group">
            <label class="login-label">Correo electrónico</label>
            <input type="email" id="log-email" required>
        </div>
        <div class="login-group">
            <label class="login-label">Contraseña</label>
            <input type="password" id="log-password" required>
        </div>

        <button type="submit" class="btn-solid" style="margin-bottom: 40px; margin-top: 10px;">CONTINUAR</button>

        <div style="text-align: center;">
            <p style="font-weight: bold; font-size: 14px;">¿No tienes cuenta?</p>
            <button type="button" class="btn-outline" onclick="nav('view-register')">REGÍSTRATE</button>
        </div>
    </form>
</div>

<div id="view-register" class="view hidden" style="max-width: 1000px;">
    <div style="display: flex; align-items: center; margin-bottom: 20px;">
        <img src="/static/leon-removebg-preview.png" alt="Logo" class="logo-nav">
        <h2 style="margin-left: 20px; font-size: 28px;">Regístrate para poder escuchar tu música favorita</h2>
    </div>

    <div style="display: flex; gap: 20px;">

        <div class="profile-container">
            <img src="/static/fotoPersona.png" id="reg-profile-preview" class="profile-pic">
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="previewImage(event)">
            <button type="button" class="btn-outline" style="margin-bottom: 15px; padding: 8px;" onclick="document.getElementById('file-input').click()">Cambiar foto</button>
            <button type="submit" form="form-register" class="btn-solid" style="padding: 8px;">GUARDAR</button>
        </div>

        <div class="panel-oscuro" style="flex: 1;">
            <form id="form-register" onsubmit="register(event)">

                <div class="flex-row">
                    <div class="col-1"><input type="text" id="reg-name" placeholder="Nombre" required></div>
                    <div class="col-1-5"><input type="text" id="reg-sur1" placeholder="1er Apellido" required></div>
                    <div class="col-1-5"><input type="text" id="reg-sur2" placeholder="2º Apellido"></div>
                </div>

                <div class="flex-row">
                    <div class="col-half"><input type="text" id="reg-user" placeholder="Nombre de Usuario" required></div>
                    <div class="col-half"><input type="date" id="reg-date" required style="color: white;"></div>
                </div>

                <div class="flex-row" style="align-items: stretch;">
                    <div class="col-half" style="display: flex; flex-direction: column; justify-content: space-between; gap: 15px;">
                        <input type="email" id="reg-email" placeholder="Dirección correo" required>
                        <input type="password" id="reg-pass" placeholder="Contraseña" required>
                    </div>
                    <div class="col-half">
                        <textarea id="reg-desc" placeholder="Descripción"></textarea>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <img src="/static/btnVolver.png" alt="Volver" class="btn-volver" onclick="nav('view-login')">
    </div>
</div>

<div id="view-catalog" class="view hidden" style="margin-top: 0;">
    <div class="navbar">
        <img src="/static/leon-removebg-preview.png" class="logo-nav">
        <input type="text" class="search-bar" placeholder="Buscar canción...">
        <div class="nav-icons">
            <img src="/static/btnCancionesFav.png" class="icon-btn" onclick="loadFavorites()">
            <img src="/static/fotoPersona.png" id="nav-profile-pic" class="icon-btn" style="border-radius: 50%; width: 45px; object-fit: cover;" onclick="loadProfile()">
            <img src="/static/btnAdmin.png" id="btn-admin" class="icon-btn hidden" onclick="nav('view-admin')">
            <button onclick="logout()" class="btn-outline" style="padding: 8px 15px; width: auto; font-size: 12px;">SALIR</button>
        </div>
    </div>
    <div class="catalog-container">
        <h3 id="catalog-title" style="text-align: left; margin-top: 0;">Catálogo General</h3>
        <div id="grid-songs" class="catalog-grid"></div>
    </div>
</div>

<div id="view-profile" class="view hidden" style="margin-top: 0;">
    <div class="navbar">
        <img src="/static/leon-removebg-preview.png" class="logo-nav">
        <button class="btn-solid" style="width: auto;" onclick="loadFavorites()">MIS CANCIONES</button>
    </div>
    <div style="display: flex; gap: 20px;">
        <div class="profile-container" style="width: 250px;">
            <img src="/static/fotoPersona.png" id="profile-view-pic" class="profile-pic">
            <button class="btn-outline">EDITAR</button>
        </div>
        <div class="panel-oscuro" style="flex: 1;" id="profile-data">
            </div>
    </div>
    <div style="margin-top: 20px;">
        <img src="/static/btnVolver.png" class="btn-volver" onclick="nav('view-catalog')">
    </div>
</div>

<div id="view-admin" class="view hidden" style="margin-top: 0;">
    <div class="navbar">
        <img src="/static/leon-removebg-preview.png" class="logo-nav">
        <h2>Panel de Administrador</h2>
    </div>
    <div class="panel-oscuro">
        <h3 style="text-align: left;">Añadir Canción al Catálogo</h3>
        <form id="form-admin" onsubmit="addSong(event)" style="display:flex; gap: 15px; align-items: center;">
            <input type="text" id="song-title" placeholder="Título" required>
            <input type="text" id="song-artist" placeholder="Artista" required>
            <button type="submit" style="background: transparent; border: none; width: auto; padding: 0;">
                <img src="/static/btnAniadirCancionAdmin.png" style="height: 50px; cursor: pointer;">
            </button>
        </form>
    </div>
    <div style="margin-top: 20px;">
        <img src="/static/btnVolver.png" class="btn-volver" onclick="nav('view-catalog')">
    </div>
</div>

<script>
    let currentUser = null;
    let currentProfilePicBase64 = "/static/fotoPersona.png"; // Imagen por defecto

    // FUNCIONALIDAD CAMBIAR FOTO
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentProfilePicBase64 = e.target.result; // Guardamos el Base64
                document.getElementById('reg-profile-preview').src = currentProfilePicBase64;
            }
            reader.readAsDataURL(file); // Convierte la imagen a texto
        }
    }

    function nav(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
        if(viewId === 'view-catalog') loadCatalog();
    }

    async function apiCall(endpoint, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(endpoint, options);
        return { ok: res.ok, data: await res.json() };
    }

    async function login(e) {
        e.preventDefault();
        const res = await apiCall('/api/login', 'POST', {
            email: document.getElementById('log-email').value,
            password: document.getElementById('log-password').value
        });
        if (res.ok) {
            currentUser = res.data.user;
            document.getElementById('btn-admin').classList.toggle('hidden', currentUser.role !== 'ADMIN');
            document.getElementById('nav-profile-pic').src = currentUser.profile_pic || '/static/fotoPersona.png';
            nav('view-catalog');
        } else alert(res.data.error);
    }

    async function register(e) {
        e.preventDefault();
        const res = await apiCall('/api/register', 'POST', {
            name: document.getElementById('reg-name').value,
            surname1: document.getElementById('reg-sur1').value,
            surname2: document.getElementById('reg-sur2').value,
            username: document.getElementById('reg-user').value,
            birth_date: document.getElementById('reg-date').value,
            email: document.getElementById('reg-email').value,
            description: document.getElementById('reg-desc').value,
            password: document.getElementById('reg-pass').value,
            profile_pic: currentProfilePicBase64 // Enviamos la foto al backend
        });
        if (res.ok) {
            alert(res.data.message); // <-- Ahora lee el mensaje del servidor
            nav('view-login');
        }
        else alert(res.data.error);
    }

    function logout() { currentUser = null; nav('view-login'); document.getElementById('form-login').reset(); }

    async function loadCatalog() {
        document.getElementById('catalog-title').innerText = "Catálogo General";
        const res = await apiCall('/api/songs');
        renderGrid(res.data, true);
    }

    async function loadFavorites() {
        document.getElementById('catalog-title').innerText = "Mis Favoritos";
        const res = await apiCall(`/api/favorites/${currentUser.id}`);
        renderGrid(res.data, false);
        nav('view-catalog');
    }

    function renderGrid(songs, isCatalog) {
        const grid = document.getElementById('grid-songs');
        grid.innerHTML = '';
        songs.forEach(s => {
            const card = document.createElement('div');
            card.className = 'song-card';

            const btnAdd = isCatalog
                ? `<button class="action-btn-wrapper" onclick="addFavorite(${s.id})"><img src="/static/btnAniadircancion.png" class="action-icon"></button>` : '';

            let btnDelete = '';
            if (isCatalog && currentUser.role === 'ADMIN') {
                btnDelete = `<button class="admin-delete-btn" onclick="deleteSong(${s.id})"><img src="/static/btnEliminar.png" class="admin-delete-icon"></button>`;
            } else if (!isCatalog) {
                btnDelete = `<button class="admin-delete-btn" onclick="alert('Funcionalidad de borrar de favoritos pendiente en backend')"><img src="/static/btnBasura.png" class="admin-delete-icon"></button>`;
            }

            card.innerHTML = `${btnDelete}<div style="font-weight: bold;">${s.title}</div><div style="font-size: 12px;">${s.artist}</div>${btnAdd}`;
            grid.appendChild(card);
        });
    }

    async function addFavorite(songId) {
        const res = await apiCall(`/api/favorites/${currentUser.id}`, 'POST', { song_id: songId });
        if(res.ok) alert('Añadida a tu lista personal');
    }

    async function loadProfile() {
        const res = await apiCall(`/api/profile/${currentUser.id}`);
        if(res.ok) {
            const d = res.data;
            document.getElementById('profile-view-pic').src = d.profile_pic || '/static/fotoPersona.png';
            document.getElementById('profile-data').innerHTML = `
                <div class="flex-row">
                    <div class="col-1"><input type="text" value="${d.name}" readonly></div>
                    <div class="col-1-5"><input type="text" value="${d.surname1}" readonly></div>
                    <div class="col-1-5"><input type="text" value="${d.surname2}" readonly></div>
                </div>
                <div class="flex-row">
                    <div class="col-half"><input type="text" value="${d.username}" readonly></div>
                    <div class="col-half"><input type="text" value="${d.birth_date}" readonly></div>
                </div>
                <div class="flex-row" style="align-items: stretch;">
                    <div class="col-half"><input type="email" value="${d.email}" readonly></div>
                    <div class="col-half"><textarea readonly>${d.description}</textarea></div>
                </div>
            `;
            nav('view-profile');
        }
    }

    async function addSong(e) {
        e.preventDefault();
        const res = await apiCall('/api/songs', 'POST', { title: document.getElementById('song-title').value, artist: document.getElementById('song-artist').value });
        if(res.ok) { alert('Guardado en el catálogo'); document.getElementById('form-admin').reset(); }
    }

    async function deleteSong(id) {
        if(confirm("¿Borrar canción?")) { await apiCall(`/api/songs/${id}`, 'DELETE'); loadCatalog(); }
    }
</script>
</body>
</html>
