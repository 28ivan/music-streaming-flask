<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Musical</title>
    <style>
        :root { --gold: #bf8b16; --text: #ffffff; }
        body {
            font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--text);
            background-image: url('/static/Fondo.png'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .hidden { display: none !important; }
        .view { width: 100%; max-width: 900px; padding: 20px; box-sizing: border-box; }
        h1, h2, h3 { text-align: center; }

        /* Imágenes */
        .logo-main { display: block; margin: 0 auto 10px; height: 100px; }
        .logo-nav { height: 60px; }
        .icon-btn { height: 45px; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { transform: scale(1.1); }
        .btn-volver { height: 50px; cursor: pointer; transition: 0.2s; }
        .btn-volver:hover { transform: translateX(-5px); }
        #nav-profile-pic { width: 45px; height: 45px; border-radius: 50%; object-fit: cover;}

        /* Inputs Base */
        input, textarea {
            width: 100%; padding: 12px 20px; border-radius: 25px; border: 2px solid var(--text);
            background: transparent; color: var(--text); box-sizing: border-box; outline: none; font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: var(--text); font-weight: bold; }
        textarea { border-radius: 15px; resize: none; height: 100%; min-height: 100px; }

        button { cursor: pointer; padding: 12px 20px; border-radius: 25px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-solid { background: var(--gold); border: 2px solid var(--gold); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--text); color: var(--text); }
        .btn-outline-gold {background: transparent; border: 2px solid var(--gold);color: white;}


        /* --- LAYOUT INICIO SESIÓN --- */
        .login-group { margin-bottom: 20px; }
        .login-label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; margin-left: 15px; text-align: left; }

        /* --- LAYOUT REGISTRO --- */
        .panel-oscuro { background: rgba(30, 20, 0, 0.6); border-radius: 20px; padding: 30px; }
        .profile-container { background: rgba(30, 20, 0, 0.6); border-radius: 20px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 220px; box-sizing: border-box; }
        .profile-pic { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-bottom: 20px; }

        /* Flexbox para colocar los inputs idénticos al boceto */
        .flex-row { display: flex; gap: 15px; margin-bottom: 15px; width: 100%; }
        .col-1 { flex: 1; }
        .col-1-5 { flex: 1.5; }
        .col-2 { flex: 2; }
        .col-half { flex: 1; width: 50%; }

        /* Navbar y Grid (Igual que antes) */
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-bar { border-radius: 25px; border: 2px solid var(--text); background: rgba(0,0,0,0.3); padding: 10px 20px; color: white; width: 350px;}
        .nav-icons { display: flex; gap: 15px; align-items: center; }
        .catalog-container { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 20px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .song-card {
            background-color: #d9d9d9;
            border-radius: 15px;
            aspect-ratio: 1;
            position: relative;
            display: flex;
            align-items: flex-start; /* Alinea el texto a la parte superior */
            justify-content: center;
            color: #ffffff;
            text-align: center;
            padding: 0; /* Quitamos el padding para el degradado */
            flex-direction: column;
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .song-card:hover {
            z-index: 20; /* Trae la tarjeta y sus botones al frente de la cuadrícula */
        }

        .action-btn-wrapper {
            position: absolute;
            bottom: -15px;
            left: -85px;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;   /* Asegura que no se quede por detrás de la tarjeta */
        }
        .action-btn-wrapper:hover { transform: scale(1.1); }
        .action-icon { height: 35px; }

        .admin-delete-btn {
            position: absolute;
            bottom: -15px; /* Mismo valor que el + para que estén a la misma altura */
            right: -85px;  /* Lo pega a la esquina derecha */
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;   /* Asegura que no se quede por detrás de la tarjeta */
        }
        .admin-delete-btn:hover { transform: scale(1.1); }
        .admin-delete-icon { height: 35px; }

        /* --- ESTILOS DEL MODAL DE LISTAS (US-4) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .playlist-modal {
            background: var(--gold); border-radius: 20px; padding: 30px; width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative;
        }
        .playlist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .playlist-header h2 { margin: 0; font-size: 32px; color: white; font-weight: bold; }
        .btn-dark { background: #8c640c; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .btn-dark:hover { transform: scale(1.05); }
        .playlist-list { max-height: 250px; overflow-y: auto; padding-right: 15px; display: flex; flex-direction: column; gap: 15px; }
        .playlist-row { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;}
        .playlist-row input { flex: 1; min-width: 200px; border: 2px solid white; background: transparent; color: white; border-radius: 20px; padding: 10px 15px; font-weight: bold; }
        .playlist-modal .btn-dark {
            padding: 6px 12px ;
            font-size: 14px;
            width: auto;
            min-width: 0;
            line-height: 1.2;
        }
    </style>
</head>
<body>

<div id="view-login" class="view">
    <img src="/static/leon-removebg-preview.png" alt="Logo" class="logo-main">
    <h2 style="font-size: 32px; margin-bottom: 30px;">¡Bienvenido!</h2>
    <form id="form-login" onsubmit="login(event)" style="max-width: 450px; margin: 0 auto;">

        <div class="login-group">
            <label class="login-label">Correo electrónico</label>
            <input type="email" id="log-email" required>
        </div>
        <div class="login-group">
            <label class="login-label">Contraseña</label>
            <input type="password" id="log-password" required>
        </div>

        <button type="submit" class="btn-outline-gold" style="margin-bottom: 40px; color: white; margin-top: 10px;">CONTINUAR</button>

        <div style="text-align: center;">
            <p style="font-weight: bold; font-size: 14px;">¿No tienes cuenta?</p>
            <button type="button" class="btn-outline" onclick="nav('view-register')">REGÍSTRATE</button>
        </div>
    </form>
</div>

<div id="view-register" class="view hidden" style="max-width: 1000px;">
    <div style="display: flex; align-items: center; margin-bottom: 20px;">
        <img src="/static/leon-removebg-preview.png" alt="Logo" class="logo-nav">
        <h2 style="margin-left: 20px; font-size: 28px;">Regístrate para poder escuchar tu música favorita</h2>
    </div>

    <div style="display: flex; gap: 20px;">

        <div class="profile-container">
            <img src="/static/btnPerfil.png" id="reg-profile-preview" class="profile-pic">
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="previewImage(event)">
            <button type="button" class="btn-outline" style="margin-bottom: 15px; padding: 8px;" onclick="document.getElementById('file-input').click()">Cambiar foto</button>
            <button type="submit" form="form-register" class="btn-solid" style="padding: 8px;">GUARDAR</button>
        </div>

        <div class="panel-oscuro" style="flex: 1;">
            <form id="form-register" onsubmit="register(event)">

                <div class="flex-row">
                    <div class="col-1"><input type="text" id="reg-name" placeholder="Nombre" required></div>
                    <div class="col-1-5"><input type="text" id="reg-sur1" placeholder="1er Apellido" required></div>
                    <div class="col-1-5"><input type="text" id="reg-sur2" placeholder="2º Apellido"></div>
                </div>

                <div class="flex-row">
                    <div class="col-half"><input type="text" id="reg-user" placeholder="Nombre de Usuario" required></div>
                    <div class="col-half"><input type="date" id="reg-date" required style="color: white;"></div>
                </div>

                <div class="flex-row" style="align-items: stretch;">
                    <div class="col-half" style="display: flex; flex-direction: column; justify-content: space-between; gap: 15px;">
                        <input type="email" id="reg-email" placeholder="Dirección correo" required>
                        <input type="password" id="reg-pass" placeholder="Contraseña" required>
                    </div>
                    <div class="col-half">
                        <textarea id="reg-desc" placeholder="Descripción"></textarea>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <img src="/static/btnVolver.png" alt="Volver" class="btn-volver" onclick="nav('view-login')">
    </div>
</div>

<div id="view-catalog" class="view hidden" style="margin-top: 0; max-width: 1200px;">
    <div class="navbar">
        <img src="/static/leon-removebg-preview.png" class="logo-nav">
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="text" id="search-input" class="search-bar" placeholder="Buscar canción..." onkeypress="handleSearchEnter(event)" oninput="checkEmptySearch()">
            <button onclick="filterSongs()" class="btn-outline-gold" style="padding: 10px 15px; width: auto; font-size: 12px; border-radius: 20px;">BUSCAR</button>
        </div>
        <div class="nav-icons">
            <img src="/static/btnCancionesFav.png" class="icon-btn" onclick="loadFavorites()">
            <img src="/static/btnPerfil.png" id="nav-profile-pic" class="icon-btn" onclick="loadProfile()">
<img src="/static/btnAniadirCancionAdmin.png" id="btn-add-song" class="icon-btn hidden" onclick="nav('view-add-song')">            <img src="/static/btnAdmin.png" id="btn-admin" class="icon-btn hidden" onclick="nav('view-admin')">
            <button onclick="logout()" class="btn-outline" style="padding: 8px 15px; width: auto; font-size: 12px;">SALIR</button>
        </div>
    </div>
    <div class="catalog-container">
        <h3 id="catalog-title" style="text-align: left; margin-top: 0;">Catálogo General</h3>
        <div id="grid-songs" class="catalog-grid"></div>
    </div>
</div>

<div id="view-profile" class="view hidden" style="margin-top: 0;">

    <div class="navbar">
        <div style="display: flex; align-items: center;">
            <img src="/static/leon-removebg-preview.png" class="logo-nav">
            <h2 id="edit-profile-title" class="hidden" style="margin-left: 20px; font-size: 28px; margin-top: 0; margin-bottom: 0;">Actualiza tu perfil</h2>
        </div>
        <button id="btn-mis-canciones" class="btn-solid" style="width: auto;" onclick="loadFavorites()">MIS CANCIONES</button>
    </div>

    <div style="display: flex; gap: 20px;">
        <div class="profile-container" style="width: 250px;">
            <img src="/static/btnPerfil.png" id="profile-view-pic" class="profile-pic">
            <button id="btn-change-pic" class="btn-outline-gold hidden" style="margin-bottom: 15px; padding: 5px 10px; font-size: 14px;" onclick="document.getElementById('profile-file-input').click()">Cambiar foto</button>
            <input type="file" id="profile-file-input" accept="image/*" class="hidden" onchange="uploadNewProfilePic(event)">
            <button id="btn-edit-profile" class="btn-outline-gold" onclick="enableEditMode()">EDITAR</button>
            <button id="btn-save-profile" class="btn-solid hidden" onclick="saveProfile()">GUARDAR</button>
        </div>
        <div class="panel-oscuro" style="flex: 1;" id="profile-data">
        </div>
    </div>

    <div style="margin-top: 20px;">
        <img src="/static/btnVolver.png" class="btn-volver" onclick="handleProfileBack()">
    </div>
</div>

<div id="view-admin" class="view hidden" style="margin-top: 0; max-width: 950px;">
    <div style="display: flex; align-items: center; margin-bottom: 30px; gap: 20px;">
        <div class="navbar">
            <img src="/static/btnAdmin.png" class="logo-nav">
        </div>
        <h2 style="font-size: 32px; margin: 0; font-weight: bold;">Administrar Cuentas</h2>
    </div>

    <div class="catalog-container" style="padding: 40px; border-radius: 20px; background: rgba(30, 20, 0, 0.8);">
        <div id="list-pending-users">
            <p>Cargando usuarios...</p>
        </div>
    </div>

    <div style="margin-top: 30px; display: flex; justify-content: flex-start;">
        <img src="/static/btnVolver.png" class="btn-volver" style="height: 60px;" onclick="nav('view-catalog')">
    </div>
</div>
<div id="view-add-song" class="view hidden" style="margin-top: 0; max-width: 950px;">
    <div style="display: flex; align-items: center; margin-bottom: 30px; gap: 20px;">
        <img src="/static/btnAniadirCancionAdmin.png" class="logo-nav">
        <h2 style="font-size: 32px; margin: 0; font-weight: bold;">Añadir canción al catálogo</h2>
    </div>

    <div class="catalog-container" style="padding: 40px; border-radius: 20px; background: rgba(30, 20, 0, 0.8);">

        <div style="display: flex; gap: 30px; align-items: flex-start;">

            <div class="profile-container" style="width: 220px; padding: 20px; margin-top: 10px;">
                <img src="/static/fotoPersona.png" id="song-cover-preview" class="profile-pic" style="border-radius: 20px; width: 100%; height: 180px; object-fit: cover; margin-bottom: 10px; border: 2px solid var(--text);">

                <input type="file" id="song-cover-input" accept="image/*" class="hidden" onchange="handleSongCoverPreview(this)">
                <button type="button" class="btn-outline-gold" style="padding: 8px 10px; font-size: 14px; width: 100%;" onclick="document.getElementById('song-cover-input').click()">Elegir carátula</button>
            </div>

            <div style="flex: 1;">
                <form id="form-add-song" onsubmit="addSongFull(event)">

                    <div class="flex-row">
                        <div class="col-2">
                            <input type="text" id="song-title" required placeholder="Nombre de la canción">
                        </div>
                        <div class="col-2">
                            <input type="text" id="song-album" placeholder="Álbum">
                        </div>
                        <div class="col-1">
                            <input type="number" id="song-track" placeholder="Nº track">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="col-2">
                            <input type="text" id="song-artist" required placeholder="Artista">
                        </div>
                        <div class="col-2">
                            <input type="number" id="song-year" placeholder="Año publicación">
                        </div>
                        <div class="col-1">
                            <input type="number" id="song-duration" placeholder="Duración (seg)">
                        </div>
                    </div>

                    <div class="flex-row">
                        <div class="col-1">
                            <textarea id="song-description" placeholder="Descripción"></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 30px; display: flex; justify-content: space-between; align-items: center;">
                        <img src="/static/btnVolver.png" class="btn-volver" style="height: 50px;" onclick="nav('view-catalog')">
                        <button type="submit" class="btn-solid" style="width: auto; padding: 10px 40px;">GUARDAR CANCIÓN</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<div id="modal-playlists" class="modal-overlay hidden">
    <div class="playlist-modal">
        <div class="playlist-header">
            <h2>Mis listas</h2>
            <button class="btn-dark" onclick="closePlaylistModal()">CERRAR</button>
        </div>

        <div class="playlist-list" id="playlist-container"></div>

        <div style="margin-top: 25px; border-top: 2px solid rgba(255,255,255,0.3); padding-top: 20px;">
            <p style="margin: 0 0 10px 0; font-weight: bold; font-size: 14px; color: white;">Crear nueva lista:</p>
            <div class="playlist-row">
                <input type="text" id="new-playlist-name" placeholder="Escribe un nombre...">
                <button class="btn-dark" onclick="createNewPlaylist()">GUARDAR</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let currentProfilePicBase64 = "/static/btnPerfil.png"; // Imagen por defecto
    // NUEVA VARIABLE: Guardará el archivo de imagen hasta que pulsemos GUARDAR
    let pendingProfilePicFile = null;
    let currentSongs = [];       // Guardará las canciones cargadas actualmente
    let isViewingCatalog = true; // Para saber qué botones pintar al filtrar

    // FUNCIONALIDAD CAMBIAR FOTO
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentProfilePicBase64 = e.target.result; // Guardamos el Base64
                document.getElementById('reg-profile-preview').src = currentProfilePicBase64;
            }
            reader.readAsDataURL(file); // Convierte la imagen a texto
        }
    }

    function nav(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
        if(viewId === 'view-catalog') loadCatalog();
        if(viewId === 'view-admin') loadPendingUsers();
    }

    async function apiCall(endpoint, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(endpoint, options);
        return { ok: res.ok, data: await res.json() };
    }

    async function login(e) {
        e.preventDefault();
        const res = await apiCall('/api/login', 'POST', {
            email: document.getElementById('log-email').value,
            password: document.getElementById('log-password').value
        });
        if (res.ok) {
            currentUser = res.data.user;
            document.getElementById('btn-admin').classList.toggle('hidden', currentUser.role !== 'ADMIN');
            // NUEVA LÍNEA PARA MOSTRAR/OCULTAR EL BOTÓN '+'
            document.getElementById('btn-add-song').classList.toggle('hidden', currentUser.role !== 'ADMIN');
            document.getElementById('nav-profile-pic').src = currentUser.profile_pic || '/static/btnPerfil.png';
            nav('view-catalog');
        } else alert(res.data.error);
    }

    async function register(e) {
        e.preventDefault();
        const res = await apiCall('/api/register', 'POST', {
            name: document.getElementById('reg-name').value,
            surname1: document.getElementById('reg-sur1').value,
            surname2: document.getElementById('reg-sur2').value,
            username: document.getElementById('reg-user').value,
            birth_date: document.getElementById('reg-date').value,
            email: document.getElementById('reg-email').value,
            description: document.getElementById('reg-desc').value,
            password: document.getElementById('reg-pass').value,
            profile_pic: currentProfilePicBase64 // Enviamos la foto al backend
        });
        if (res.ok) {
            alert(res.data.message); // <-- Ahora lee el mensaje del servidor
            nav('view-login');
        }
        else alert(res.data.error);
    }

    function logout() { currentUser = null; nav('view-login'); document.getElementById('form-login').reset(); }

    async function loadCatalog() {
        document.getElementById('catalog-title').innerText = "Catálogo General";
        isViewingCatalog = true;
        document.getElementById('search-input').value = ""; // Limpia el buscador al entrar

        const res = await apiCall('/api/songs');
        if (res.ok) {
            currentSongs = res.data; // Guardamos la lista original
            renderGrid(currentSongs, true);
        }
    }

    async function loadFavorites() {
        document.getElementById('catalog-title').innerText = "Mis Favoritos";
        isViewingCatalog = false;
        document.getElementById('search-input').value = ""; // Limpia el buscador al entrar

        const res = await apiCall(`/api/favorites/${currentUser.id}`);
        if (res.ok) {
            currentSongs = res.data; // Guardamos la lista original
            renderGrid(currentSongs, false);
            nav('view-catalog');
        }
    }

    // NUEVA FUNCIÓN: Permite buscar al pulsar la tecla "Enter"
    function handleSearchEnter(event) {
        if (event.key === 'Enter') {
            filterSongs();
        }
    }

    // NUEVA FUNCIÓN: Filtrar canciones
    function filterSongs() {
        const query = document.getElementById('search-input').value.toLowerCase();

        // Si el buscador está vacío, volvemos a mostrar todas las canciones
        if (query.trim() === '') {
            renderGrid(currentSongs, isViewingCatalog);
            return;
        }

        // Filtramos buscando coincidencias en el título o en el artista
        const filtered = currentSongs.filter(s =>
            s.title.toLowerCase().includes(query) ||
            s.artist.toLowerCase().includes(query)
        );

        // Renderizamos solo las canciones que coinciden
        renderGrid(filtered, isViewingCatalog);
    }

    // NUEVA FUNCIÓN: Restaura la lista completa automáticamente si borras todo el texto
    function checkEmptySearch() {
        const query = document.getElementById('search-input').value;
        if (query.trim() === '') {
            renderGrid(currentSongs, isViewingCatalog);
        }
    }

    function renderGrid(songs, isCatalog) {
        const grid = document.getElementById('grid-songs');
        grid.innerHTML = '';

        songs.forEach(s => {
            const card = document.createElement('div');
            card.className = 'song-card';

            // Si la canción tiene portada, la ponemos de fondo.
            if (s.cover_pic) {
                card.style.backgroundImage = `url('${s.cover_pic}')`;
            }

            // Botón inferior izquierdo (+) -> AHORA ABRE EL MODAL DE LISTAS
            const btnAdd = isCatalog
                ? `<button class="action-btn-wrapper" onclick="openPlaylistModal(${s.id})">
                     <img src="/static/btnAniadircancion.png" class="action-icon" style="background: white; border-radius: 50%;">
                   </button>`
                : '';

            // Botón inferior derecho (x)
            let btnDelete = '';
            if (isCatalog && currentUser.role === 'ADMIN') {
                btnDelete = `<button class="admin-delete-btn" onclick="deleteSong(${s.id})">
                               <img src="/static/btnEliminar.png" class="admin-delete-icon" style="background: white; border-radius: 50%;">
                             </button>`;
            } else if (!isCatalog) {
            btnDelete = `<button class="admin-delete-btn" onclick="removeFavorite(${s.id})">
                   <img src="/static/btnBasura.png" class="admin-delete-icon" style="background: white; border-radius: 50%;">
                 </button>`;
}


            // Contenedor con degradado superior para asegurar legibilidad sin tapar la foto
            card.innerHTML = `
                <div style="background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); width: 100%; padding: 15px 10px 30px 10px; box-sizing: border-box; border-radius: 15px 15px 0 0; pointer-events: none;">
                    <div style="font-weight: bold; font-size: 15px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${s.title}</div>
                    <div style="font-size: 12px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ddd; margin-top: 2px;">${s.artist}</div>
                </div>
                ${btnAdd}
                ${btnDelete}
            `;

            grid.appendChild(card);
        });
    }

    // ==========================================================
    // LÓGICA DE LISTAS DE REPRODUCCIÓN (US-4)
    // ==========================================================
    let currentSongToPlaylist = null; // Guarda qué canción vamos a añadir

    async function openPlaylistModal(songId) {
        currentSongToPlaylist = songId;
        document.getElementById('modal-playlists').classList.remove('hidden');
        await fetchAndRenderPlaylists();
    }

    function closePlaylistModal() {
        document.getElementById('modal-playlists').classList.add('hidden');
        currentSongToPlaylist = null;
        document.getElementById('new-playlist-name').value = ''; // Limpiar el input
    }

    async function fetchAndRenderPlaylists() {
        const container = document.getElementById('playlist-container');
        container.innerHTML = '<p style="text-align: center; color: white;">Cargando listas...</p>';

        const res = await apiCall(`/api/playlists/${currentUser.id}`);
        if(res.ok) {
            container.innerHTML = '';
            if(res.data.length === 0) {
                container.innerHTML = '<p style="text-align:center; font-size: 14px; color: white;">Aún no tienes listas. Crea una abajo.</p>';
            } else {
                res.data.forEach(p => {
                    // Pintamos cada lista con su botón de añadir (+) y borrar (x)
                    container.innerHTML += `
                        <div class="playlist-row">
                            <input type="text" value="${p.name}" readonly>
                            <img src="/static/btnAniadircancion.png" class="icon-btn" style="height: 35px; background: white; border-radius: 50%; padding: 2px; box-sizing: border-box;" onclick="addSongToPlaylist(${p.id})">
                            <img src="/static/btnEliminar.png" class="icon-btn" style="height: 35px; background: white; border-radius: 50%; padding: 2px; box-sizing: border-box;" onclick="deletePlaylist(${p.id})">
                        </div>
                    `;
                });
            }
        }
    }

    async function createNewPlaylist() {
        const nameInput = document.getElementById('new-playlist-name');
        if(!nameInput.value.trim()) return alert("Por favor, ponle un nombre a la lista.");

        const res = await apiCall(`/api/playlists/${currentUser.id}`, 'POST', { name: nameInput.value });
        if(res.ok) {
            nameInput.value = '';
            fetchAndRenderPlaylists();
        } else {
            alert(res.data.error || "Error al crear la lista");
        }
    }

    async function addSongToPlaylist(playlistId) {
        if(!currentSongToPlaylist) return;
        const res = await apiCall(`/api/playlists/${playlistId}/songs`, 'POST', { song_id: currentSongToPlaylist });
        if(res.ok) {
            alert('¡Canción añadida a la lista!');
            closePlaylistModal(); // Cerramos el modal al terminar
        } else {
            alert(res.data.error || "Error al añadir la canción");
        }
    }

    async function deletePlaylist(playlistId) {
        if(confirm("¿Seguro que quieres borrar esta lista y todas las canciones que contiene?")) {
            const res = await apiCall(`/api/playlists/${playlistId}`, 'DELETE');
            if(res.ok) fetchAndRenderPlaylists(); // Recargamos para que desaparezca
        }
    }

    async function loadProfile() {
        pendingProfilePicFile = null; // <-- AÑADIR ESTA LÍNEA
        // <-- AÑADE ESTA NUEVA LÍNEA PARA VACIAR EL INPUT DE LA FOTO -->
        document.getElementById('profile-file-input').value = "";

        const res = await apiCall(`/api/profile/${currentUser.id}`);
        if(res.ok) {
            const d = res.data;
            document.getElementById('profile-view-pic').src = d.profile_pic || '/static/btnPerfil.png';

            // Añadimos IDs específicos (prof-name, prof-sur1, etc.) a cada input
            document.getElementById('profile-data').innerHTML = `
                <div class="flex-row">
                    <div class="col-1"><input type="text" id="prof-name" value="${d.name}" readonly></div>
                    <div class="col-1-5"><input type="text" id="prof-sur1" value="${d.surname1}" readonly></div>
                    <div class="col-1-5"><input type="text" id="prof-sur2" value="${d.surname2 || ''}" readonly></div>
                </div>
                <div class="flex-row">
                    <div class="col-half"><input type="text" id="prof-user" value="${d.username}" readonly></div>
                    <div class="col-half"><input type="date" id="prof-date" value="${d.birth_date}" readonly style="color: white;"></div>
                </div>
                <div class="flex-row" style="align-items: stretch;">
                    <div class="col-half"><input type="email" id="prof-email" value="${d.email}" readonly></div>
                    <div class="col-half"><textarea id="prof-desc" readonly>${d.description || ''}</textarea></div>
                </div>
            `;

            // Reiniciamos los botones al estado de "solo lectura" cada vez que se carga el perfil
            document.getElementById('btn-edit-profile').classList.remove('hidden');
            document.getElementById('btn-save-profile').classList.add('hidden');
            document.getElementById('btn-change-pic').classList.add('hidden'); // NUEVO

            // --- NUEVO: Esconder título y mostrar botón Mis Canciones ---
            document.getElementById('edit-profile-title').classList.add('hidden');
            document.getElementById('btn-mis-canciones').classList.remove('hidden');

            nav('view-profile');
        }
    }

    // MODIFICADA: Ahora solo hace previsualización y guarda el archivo "en pausa"
    function uploadNewProfilePic(event) {
        const file = event.target.files[0];
        if (!file) return;

        // 1. Mostrar la nueva foto visualmente de inmediato (Preview)
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('profile-view-pic').src = e.target.result;
        }
        reader.readAsDataURL(file);

        // 2. Guardar el archivo en la variable global para enviarlo luego
        pendingProfilePicFile = file;
    }

    // NUEVA FUNCIÓN: Flecha de volver inteligente
    function handleProfileBack() {
        // Comprobamos si estamos en modo edición (si el botón GUARDAR está visible)
        const isEditing = !document.getElementById('btn-save-profile').classList.contains('hidden');

        if (isEditing) {
            pendingProfilePicFile = null; // <-- AÑADIR ESTA LÍNEA
            // Si estamos editando, cancelamos la edición recargando el perfil (restaura datos originales)
            loadProfile();
        } else {
            // Si solo estamos mirando, volvemos al catálogo general
            nav('view-catalog');
        }
    }

    // NUEVA FUNCIÓN: Quita el bloqueo de los campos
    function enableEditMode() {
        const inputs = document.querySelectorAll('#profile-data input, #profile-data textarea');
        inputs.forEach(input => {
            // Evitamos que el usuario edite su email y nombre de usuario por seguridad
            if (input.id !== 'prof-email' && input.id !== 'prof-user') {
                input.removeAttribute('readonly');
                input.style.border = "2px solid var(--gold)"; // Resaltamos en dorado lo que se puede editar
            }
        });
        // Ocultamos "EDITAR" y mostramos "GUARDAR"
        document.getElementById('btn-edit-profile').classList.add('hidden');
        document.getElementById('btn-save-profile').classList.remove('hidden');
        document.getElementById('btn-change-pic').classList.remove('hidden'); // NUEVO

        // --- NUEVO: Alternar el título de la cabecera ---
        document.getElementById('edit-profile-title').classList.remove('hidden');
        document.getElementById('btn-mis-canciones').classList.add('hidden');
    }

    // MODIFICADA: Envía los textos y, si hay foto nueva, la sube también
    async function saveProfile() {
        const body = {
            name: document.getElementById('prof-name').value,
            surname1: document.getElementById('prof-sur1').value,
            surname2: document.getElementById('prof-sur2').value,
            birth_date: document.getElementById('prof-date').value,
            description: document.getElementById('prof-desc').value
        };

        // 1. Guardar los datos de texto
        const res = await apiCall(`/api/profile/${currentUser.id}`, 'PUT', body);

        if (res.ok) {
            // 2. Comprobar si el usuario seleccionó una foto nueva
            if (pendingProfilePicFile) {
                const formData = new FormData();
                formData.append('file', pendingProfilePicFile);

                try {
                    const picRes = await fetch(`/api/profile/${currentUser.id}/upload-pic`, {
                        method: 'POST',
                        body: formData
                    });
                    const picResult = await picRes.json();

                    if (picRes.ok) {
                        // Actualizar la foto en memoria y en la barra superior
                        currentUser.profile_pic = picResult.new_pic_url;
                        document.getElementById('nav-profile-pic').src = currentUser.profile_pic;
                    } else {
                        alert("Textos guardados, pero falló la foto: " + picResult.error);
                    }
                } catch (error) {
                    alert("Textos guardados, pero hubo un error de conexión al subir la foto.");
                }
            }

            alert("Perfil actualizado correctamente");

            // 3. Limpiar la variable y recargar la vista
            pendingProfilePicFile = null;
            loadProfile();
        } else {
            alert("Error al actualizar los datos del perfil");
        }
    }

    async function addSong(e) {
        e.preventDefault();
        const res = await apiCall('/api/songs', 'POST', { title: document.getElementById('song-title').value, artist: document.getElementById('song-artist').value });
        if(res.ok) { alert('Guardado en el catálogo'); document.getElementById('form-admin').reset(); }
    }

    async function deleteSong(id) {
        if(confirm("¿Borrar canción?")) { await apiCall(`/api/songs/${id}`, 'DELETE'); loadCatalog(); }
    }

    async function loadPendingUsers() {
        const container = document.getElementById('list-pending-users');
        const res = await apiCall('/api/admin/pending_users');

        if (res.ok) {
            if (res.data.length === 0) {
                container.innerHTML = "<p style='text-align: center; color: white; font-weight: bold;'>No hay usuarios pendientes de aprobación.</p>";
                return;
            }

            // Creamos el grid de 2 columnas con la clase de scroll
            let html = `
                <div class="admin-scroll" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-height: 350px; overflow-y: auto; padding-right: 15px;">`;

            res.data.forEach(u => {

                // Lógica condicional para el avatar
                let avatarHtml = '';
                if (u.profile_pic && u.profile_pic !== '/static/btnPerfil.png') {
                    // Si el usuario TIENE foto personalizada: ocupa los 75x75 completos
                    avatarHtml = `<img src="${u.profile_pic}" style="width: 75px; height: 75px; border-radius: 20px; object-fit: cover; flex-shrink: 0; background: #f2f2f2;">`;
                } else {
                    // Si NO tiene foto: caja contenedora de 75x75 y el icono por defecto más pequeño (45x45) centrado
                    avatarHtml = `
                        <div style="width: 75px; height: 75px; background: #f2f2f2; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                            <img src="/static/fotoPersona.png" style="width: 45px; height: 45px; object-fit: contain;">
                        </div>`;
                }

                html += `
                    <div style="display: flex; align-items: center; gap: 10px;">

                        ${avatarHtml}

                        <div style="background: #f2f2f2; color: #000; border-radius: 20px; height: 75px; display: flex; align-items: center; padding: 0 15px; flex: 1; font-weight: bold; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            ${u.username}
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;">
                            <img src="/static/btnAniadircancion.png" class="icon-btn" style="width: 35px; height: 35px; background: #f2f2f2; border-radius: 50%; padding: 4px; box-sizing: border-box;" onclick="approveUser(${u.id})">
                            <img src="/static/btnBasura.png" class="icon-btn" style="width: 35px; height: 35px; background: #f2f2f2; border-radius: 50%; padding: 4px; box-sizing: border-box;" onclick="rejectUser(${u.id})">
                        </div>

                    </div>`;
            });

            html += `</div>`;
            container.innerHTML = html;
        } else {
            container.innerHTML = "<p>Error al cargar usuarios.</p>";
        }
    } // <-- Aquí se cierra loadPendingUsers

    async function approveUser(userId) {
        if (confirm("¿Estás seguro de que quieres aprobar a este usuario?")) {
            const res = await apiCall(`/api/admin/approve/${userId}`, 'POST');
            if (res.ok) {
                alert(res.data.message);
                loadPendingUsers();
            } else {
                alert("Error al aprobar al usuario");
            }
        }
    } // <-- Aquí se cierra approveUser

    async function rejectUser(userId) {
        if (confirm("¿Estás seguro de que quieres denegar el acceso? El usuario será eliminado.")) {
            const res = await apiCall(`/api/admin/reject/${userId}`, 'DELETE');
            if (res.ok) {
                alert(res.data.message);
                loadPendingUsers();
            } else {
                alert("Error al eliminar al usuario");
            }
        }
    }

    // ==========================================================
// PREVISUALIZACIÓN DE LA PORTADA
// ==========================================================
function handleSongCoverPreview(input) {
    if (!input.files || !input.files[0]) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        // Asignamos el Base64 a la imagen del HTML para que el admin la vea
        document.getElementById('song-cover-preview').src = e.target.result;
    }
    reader.readAsDataURL(input.files[0]);
}

// ==========================================================
// US-6: AÑADIR CANCIÓN COMPLETO (ADMIN) - ACTUALIZADO CON FOTO
// ==========================================================
async function addSongFull(e) {
    e.preventDefault();

    // UI Feedback para evitar doble clic
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = "Guardando...";
    submitBtn.disabled = true;

    // Recogemos todos los campos, incluyendo la ruta Base64 de la previsualización
    const body = {
        title: document.getElementById('song-title').value,
        artist: document.getElementById('song-artist').value,
        album: document.getElementById('song-album').value,
        duration_seconds: document.getElementById('song-duration').value,
        track_number: document.getElementById('song-track').value,
        release_year: document.getElementById('song-year').value,
        song_description: document.getElementById('song-description').value,
        cover_pic: document.getElementById('song-cover-preview').src
    };

    const res = await apiCall('/api/songs', 'POST', body);

    // Restauramos el botón
    submitBtn.textContent = originalText;
    submitBtn.disabled = false;

    if (res.ok) {
        alert("Canción añadida correctamente");

        // Limpiamos el formulario y la foto para la siguiente vez
        document.getElementById('form-add-song').reset();
        document.getElementById('song-cover-preview').src = '/static/fotoPersona.png';

        // Volvemos al catálogo y lo recargamos
        nav('view-catalog');
        loadCatalog();
    } else {
        alert("Error al añadir canción: " + res.error);
    }
}


// ==========================================================
// US-4: BORRAR DE FAVORITOS
// ==========================================================
async function removeFavorite(songId) {
    const res = await apiCall(`/api/favorites/${currentUser.id}/${songId}`, 'DELETE');
    if (res.ok) {
        alert("Canción eliminada de favoritos");
        loadFavorites();
    } else {
        alert("Error al eliminar de favoritos");
    }
}
